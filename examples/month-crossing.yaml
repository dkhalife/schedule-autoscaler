apiVersion: dkhalife.dev/v1alpha1
kind: ScaleSchedule
metadata:
  name: month-end-processing
  namespace: storefront
spec:
  timeZone: Europe/Paris
  schedule:
    type: Monthly
    monthly:
      months: [1, 3, 5, 7, 8, 10, 12]
      days: [31]
      startTime: "22:00"
      durationMinutes: 480
---
apiVersion: dkhalife.dev/v1alpha1
kind: DeploymentScalePlan
metadata:
  name: month-end-worker
  namespace: storefront
spec:
  targetRef:
    name: month-end-worker
  baseline: 0
  rules:
    - name: month-end-batch
      scheduleRef:
        kind: ScaleSchedule
        name: month-end-processing
      replicas: 12
      priority: 20
