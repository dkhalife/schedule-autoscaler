apiVersion: apps/v1
kind: Deployment
metadata:
  name: schedule-autoscaler
  namespace: schedule-autoscaler-system
  labels:
    app.kubernetes.io/name: schedule-autoscaler
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: schedule-autoscaler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schedule-autoscaler
    spec:
      serviceAccountName: schedule-autoscaler
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/dkhalife/schedule-autoscaler:v0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            - --controller-service-account=schedule-autoscaler
            - --controller-namespace=schedule-autoscaler-system
            - --scaler-cluster-role=deployment-scale-editor
            - --namespace-selector=scaling.dkhalife.dev/enabled=true
            - --log-level=info
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: schedule-autoscaler-metrics
  namespace: schedule-autoscaler-system
spec:
  selector:
    app.kubernetes.io/name: schedule-autoscaler
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: schedule-autoscaler
  namespace: schedule-autoscaler-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: schedule-autoscaler
