apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterscaleschedules.dkhalife.dev
  labels:
    app.kubernetes.io/name: schedule-autoscaler
spec:
  group: dkhalife.dev
  scope: Cluster
  names:
    plural: clusterscaleschedules
    singular: clusterscaleschedule
    kind: ClusterScaleSchedule
    shortNames:
      - css
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.schedule.type
        - name: Time Zone
          type: string
          jsonPath: .spec.timeZone
        - name: Valid
          type: string
          jsonPath: .status.conditions[?(@.type=="Valid")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          description: ClusterScaleSchedule defines a reusable, cluster-scoped calendar for scale plans.
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - schedule
              x-kubernetes-validations:
                - rule: "!has(self.validFrom) || !has(self.validUntil) || timestamp(self.validFrom) < timestamp(self.validUntil)"
                  message: validFrom must be earlier than validUntil
              properties:
                timeZone:
                  type: string
                  default: UTC
                  minLength: 1
                  maxLength: 128
                  pattern: '^(UTC|Etc/UTC|[A-Za-z][A-Za-z0-9._+-]*(/[A-Za-z0-9._+-]+)+)$'
                  description: IANA time zone used to interpret monthly occurrence start times.
                validFrom:
                  type: string
                  format: date-time
                  description: Inclusive instant before which this schedule is inactive.
                validUntil:
                  type: string
                  format: date-time
                  description: Exclusive instant at and after which this schedule is inactive.
                schedule:
                  type: object
                  required:
                    - type
                  x-kubernetes-validations:
                    - rule: "self.type == 'Always' ? !has(self.monthly) : has(self.monthly)"
                      message: monthly must be set exactly when type is Monthly
                  properties:
                    type:
                      type: string
                      enum:
                        - Always
                        - Monthly
                      description: Always is continuously active; Monthly uses recurring local-time windows.
                    monthly:
                      type: object
                      required:
                        - days
                        - startTime
                        - durationMinutes
                      properties:
                        months:
                          type: array
                          minItems: 1
                          maxItems: 12
                          x-kubernetes-list-type: set
                          description: Optional start-month filter using numbers 1 through 12.
                          items:
                            type: integer
                            minimum: 1
                            maximum: 12
                        days:
                          type: array
                          minItems: 1
                          maxItems: 31
                          x-kubernetes-list-type: set
                          description: Local calendar days on which a window starts.
                          items:
                            type: integer
                            minimum: 1
                            maximum: 31
                        startTime:
                          type: string
                          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
                          description: Local wall-clock start time in 24-hour HH:mm form.
                        durationMinutes:
                          type: integer
                          format: int32
                          minimum: 1
                          maximum: 44640
                          description: Length of each occurrence; windows may cross day, month, or year boundaries.
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                conditions:
                  type: array
                  maxItems: 16
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - reason
                      - message
                      - lastTransitionTime
                    properties:
                      type:
                        type: string
                        maxLength: 316
                        pattern: '^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?([A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?)$'
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 1024
                        pattern: '^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$'
                      message:
                        type: string
                        maxLength: 32768
                nextTransitionTime:
                  type: string
                  format: date-time
                  description: Best-effort instant at which this schedule next changes active state.
---
