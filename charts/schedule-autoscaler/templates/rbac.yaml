{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "schedule-autoscaler.fullname" . }}-controller
  labels:
    {{- include "schedule-autoscaler.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["list", "watch", "create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    resourceNames: ["schedule-autoscaler"]
    verbs: ["get", "update", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["deployment-scale-editor"]
    verbs: ["bind"]
  - apiGroups: ["dkhalife.dev"]
    resources: ["clusterscaleschedules", "scaleschedules", "deploymentscaleplans"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["dkhalife.dev"]
    resources: ["clusterscaleschedules/status", "scaleschedules/status", "deploymentscaleplans/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "schedule-autoscaler.fullname" . }}-controller
  labels:
    {{- include "schedule-autoscaler.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "schedule-autoscaler.fullname" . }}-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "schedule-autoscaler.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "schedule-autoscaler.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "schedule-autoscaler.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "schedule-autoscaler.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "schedule-autoscaler.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "schedule-autoscaler.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "schedule-autoscaler.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.rbac.createDeploymentScaleEditor }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deployment-scale-editor
  labels:
    {{- include "schedule-autoscaler.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
{{- end }}
{{- end }}
